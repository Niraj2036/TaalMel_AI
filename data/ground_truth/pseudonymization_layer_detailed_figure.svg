<svg width="680" height="574" viewBox="0 0 680 574" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Pseudonymization layer, detailed</title>
<desc>Diagram showing how the pseudonymization layer takes a canonical entity with its aliases, applies stable pseudonym assignment, alias learning, and relationship preservation, then produces a sanitized semantic chunk that is embedded into the secure vector store, with a worked example.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="574" fill="#FFFFFF"/>

<!-- A: input from registry -->
<rect x="170" y="40" width="340" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A8A">From global entity registry</text>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B5998">Canonical entity ID + known aliases</text>

<line x1="340" y1="96" x2="340" y2="140" stroke="#3D3D3A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Container: Pseudonymization layer -->
<rect x="50" y="140" width="580" height="170" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
<text x="70" y="162" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#065F46">Pseudonymization layer</text>

<!-- Sub-box 1: stable assignment -->
<rect x="66" y="180" width="170" height="100" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="0.75"/>
<text x="151" y="198" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#065F46">Stable assignment</text>
<text x="151" y="222" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0D7D5C">Same entity always</text>
<text x="151" y="240" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0D7D5C">gets same pseudonym</text>
<text x="151" y="262" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0D7D5C">Mapping never changes</text>

<!-- Sub-box 2: alias learning -->
<rect x="256" y="180" width="170" height="100" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="0.75"/>
<text x="341" y="198" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#065F46">Alias learning</text>
<text x="341" y="222" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0D7D5C">New aliases linked</text>
<text x="341" y="240" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0D7D5C">to canonical entity</text>
<text x="341" y="262" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0D7D5C">on high confidence</text>

<!-- Sub-box 3: relationship preservation -->
<rect x="446" y="180" width="170" height="100" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="0.75"/>
<text x="531" y="198" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#065F46">Meaning preserved</text>
<text x="531" y="222" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0D7D5C">Semantic meaning</text>
<text x="531" y="240" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0D7D5C">stays intact</text>
<text x="531" y="262" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0D7D5C">across all mentions</text>

<!-- connectors between sub-steps -->
<line x1="236" y1="230" x2="254" y2="230" stroke="#3D3D3A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="426" y1="230" x2="444" y2="230" stroke="#3D3D3A" stroke-width="1" marker-end="url(#arrow)"/>

<line x1="340" y1="310" x2="340" y2="350" stroke="#3D3D3A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Worked example -->
<rect x="110" y="350" width="460" height="100" rx="8" fill="#F5F5F4" stroke="#57534E" stroke-width="1"/>
<text x="340" y="370" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C1917">Worked example</text>
<text x="340" y="396" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D3D3A">Original: "Niraj Chaudhari approved the payroll document."</text>
<text x="340" y="416" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#059669">Sanitized: "EMPLOYEE_001 approved the payroll document."</text>
<text x="340" y="434" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57534E">Same pseudonym used for every alias, in every document</text>

<line x1="340" y1="450" x2="340" y2="490" stroke="#3D3D3A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Output -->
<rect x="50" y="490" width="580" height="44" rx="8" fill="#F5F5F4" stroke="#57534E" stroke-width="1"/>
<text x="340" y="512" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C1917">Sanitized semantic chunk → embedding → secure vector store</text>

</svg>
